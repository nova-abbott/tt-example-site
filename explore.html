<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.explore">Explore · Translation Corpus Explorer (Example)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1><span data-i18n="site.name">Translation Corpus Explorer</span> <small class="badge" data-i18n="site.badge">Example</small></h1>
    <nav>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="explore.html" class="active" data-i18n="nav.explore">Explore</a>
      <a href="visualize.html" data-i18n="nav.visualize">Visualize</a>
      <a href="codebook.html" data-i18n="nav.codebook">Codebook</a>
      <a href="report.html" data-i18n="nav.report">Report</a>
      <a href="about.html" data-i18n="nav.about">About</a>
    </nav>
  </header>

  <main>
    <h2 data-i18n="explore.h2">Explore the corpus</h2>
    <div class="controls">
      <label><span data-i18n="explore.q">Search (English or Chinese)</span>
        <input id="q" type="search" data-i18n-placeholder="explore.q.ph" placeholder="e.g., court, 法庭">
      </label>
      <label><span data-i18n="explore.cat">Category</span>
        <select id="category"><option value="" data-i18n="explore.cat.all">All categories</option></select>
      </label>
      <label><span data-i18n="explore.chk">Human checked?</span>
        <select id="checked">
          <option value="" data-i18n="opt.all">All</option>
          <option value="yes" data-i18n="opt.yes">Yes</option>
          <option value="no" data-i18n="opt.no">No</option>
        </select>
      </label>
    </div>
    <p class="count" id="count" data-i18n="status.loading">Loading…</p>
    <table>
      <thead>
        <tr>
          <th data-i18n="explore.th.num">#</th>
          <th data-i18n="explore.th.en">English (source)</th>
          <th data-i18n="explore.th.zh">Chinese (target)</th>
          <th data-i18n="explore.th.cat">Category</th>
          <th data-i18n="explore.th.chk">Checked</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <footer class="site-footer"><a href="about.html" data-i18n="footer.about">About this site and data</a></footer>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    const el = {
      q: document.getElementById("q"),
      category: document.getElementById("category"),
      checked: document.getElementById("checked"),
      rows: document.getElementById("rows"),
      count: document.getElementById("count"),
    };

    function render() {
      const filtered = applyFilters(corpus, {
        query: el.q.value,
        category: el.category.value,
        checked: el.checked.value,
      });
      el.count.textContent = t("explore.count", { n: filtered.length, total: corpus.length });
      el.rows.innerHTML = filtered.slice(0, 200).map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${highlight(r.source_text, el.q.value)}</td>
          <td class="zh">${highlight(r.target_text, el.q.value)}</td>
          <td>${catLabel(r.category)}</td>
          <td>${t("opt." + r.human_checked)}</td>
        </tr>`).join("");
    }

    loadCorpus().then(() => {
      fillSelect(el.category, corpus.map(r => r.category), catLabel);
      el.q.addEventListener("input", render);
      el.category.addEventListener("change", render);
      el.checked.addEventListener("change", render);
      document.addEventListener("langchange", () => {
        fillSelect(el.category, corpus.map(r => r.category), catLabel);
        render();
      });
      render();
    }).catch(err => { el.count.textContent = t("status.error") + err.message; });
  </script>
</body>
</html>
